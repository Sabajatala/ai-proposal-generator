version: "3"

services:

  backend:
    build: ./server
    container_name: ai-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo

  frontend:
    build: ./client
    container_name: ai-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: ai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: